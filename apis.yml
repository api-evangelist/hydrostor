aid: hydrostor
name: Hydrostor
description: >-
  Hydrostor is a Canadian long-duration energy storage developer founded in 2010 and headquartered in
  Toronto, with offices in Denver, Colorado and Melbourne and Adelaide, Australia. It builds and operates
  Advanced Compressed Air Energy Storage (A-CAES) facilities: surplus grid electricity runs a compressor,
  the heat of compression is captured and stored, and the cooled compressed air is sent into a purpose-built
  underground cavern held at constant pressure by a water column. On discharge the water weight pushes the
  air back to surface, where it is recombined with the stored heat and expanded through a turbine, giving
  eight or more hours of emissions-free storage from a plant with a multi-decade asset life. The company is
  backed by Goldman Sachs Alternatives, CPP Investments, the Canada Growth Fund, Canoe Financial and Arctern
  Ventures, operates a commercially contracted utility-scale facility in Goderich, Ontario, and is advancing
  a roughly 7 GW pipeline including the Willow Rock and Copper Valley centers in California, Silver City in
  New South Wales, and Quinte and Wellington in Ontario. Hydrostor is an energy infrastructure developer
  rather than a software vendor: it publishes no developer portal, no SDKs, no product API and no
  machine-readable specification of its own. The only machine-readable interface it exposes is the WordPress
  core REST content API behind hydrostor.ca, which is anonymously readable, read-only without credentials,
  and carries the project portfolio, the newsroom archive and the media library. That surface is profiled
  here for discovery purposes and is described from the site's own self-describing route index.
