source: openapi/ ($ref links and id-reference fields) + https://hydrostor.ca/wp-json/wp/v2/types and /taxonomies
description: >-
  Entity graph for the WordPress REST content API behind hydrostor.ca, derived from the published resource
  schemas and the site's own registered type/taxonomy declarations. Identifiers are integers, not prefixed
  strings — there is no id-prefix scheme to key on, so an id is only meaningful together with its resource.
identifiers:
  scheme: opaque positive integers, unique per site (not per type)
  detail: >-
    A single integer namespace covers posts, pages, projects and media, so an id alone does not tell you
    the resource. The search endpoint is the only place that returns id plus type plus subtype together,
    which makes it the correct entry point for resolving an unknown id.
