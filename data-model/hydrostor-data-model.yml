finding: >-
  The data model is stock WordPress with one Hydrostor-specific extension: the `project` type and its two
  taxonomies. The taxonomies are the interesting gap — they are registered against the project portfolio
  and are fully readable, but carry zero terms, so the six A-CAES projects cannot be filtered by region,
  market, status or technology through the API even though the marketing site groups them that way. That
  is a content-modelling gap on Hydrostor's side, not a limitation of the interface.
